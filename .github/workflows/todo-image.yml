name: Build To Do image

# Custom fork build: Vikunja renamed to "To Do" (plus later tweaks).
# Builds the upstream Dockerfile unmodified and publishes to this fork's GHCR
# namespace. Branch `todo` is cut from upstream tag v2.6.0 and is the fork's
# default branch; upstream's own workflows are deleted on it so their
# schedules and triggers never run here.

on:
  push:
    branches: [todo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Bump the suffix (-todo.2, -todo.3, ...) for every change: tags are
  # immutable and the cluster pulls with imagePullPolicy: IfNotPresent.
  VERSION: v2.6.0-todo.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/coultonf/vikunja:${{ env.VERSION }}
            ghcr.io/coultonf/vikunja:todo
          build-args: |
            RELEASE_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/CoultonF/vikunja
          cache-from: type=gha
          cache-to: type=gha,mode=max
